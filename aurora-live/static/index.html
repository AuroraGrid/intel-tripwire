<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AURORA LIVE</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>:root{--bg:#081018;--panel:#101b26;--line:#263747;--text:#e9f0f5;--muted:#8da0af;--red:#ff4d4f;--amber:#f5a623;--green:#46d38a;--blue:#56a8ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,sans-serif;height:100vh;overflow:hidden}header{height:58px;display:flex;align-items:center;gap:18px;padding:0 18px;border-bottom:1px solid var(--line);background:#0a131d}.brand{font-weight:800;letter-spacing:.08em}.brand b{color:var(--red)}.badge{font-size:11px;padding:4px 7px;border:1px solid var(--line);border-radius:4px;color:var(--muted)}#layout{display:grid;grid-template-columns:280px 1fr 390px;height:calc(100vh - 58px)}aside,main{min-width:0}.left,.right{background:var(--panel);overflow:auto}.left{border-right:1px solid var(--line)}.right{border-left:1px solid var(--line)}.section{padding:14px;border-bottom:1px solid var(--line)}input,select,button{width:100%;background:#0b141e;color:var(--text);border:1px solid var(--line);padding:9px;border-radius:5px;margin-top:7px}button{cursor:pointer}.event{padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}.event:hover,.event.active{background:#172534}.event h3{font-size:13px;margin:0 0 7px}.meta{display:flex;gap:6px;flex-wrap:wrap;font-size:11px;color:var(--muted)}.pill{padding:2px 6px;border:1px solid var(--line);border-radius:10px}.critical,.high{color:var(--red)}.medium{color:var(--amber)}.SUPPORTED{color:var(--green)}.PLAUSIBLE{color:var(--blue)}.NOT_PROVEN{color:var(--amber)}#map{height:100%}.right h2{font-size:18px;margin:0 0 10px}.right h4{margin:16px 0 6px;color:var(--muted);text-transform:uppercase;font-size:11px;letter-spacing:.08em}.evidence{padding:9px 0;border-top:1px solid var(--line)}a{color:#8bc4ff}.empty{padding:24px;color:var(--muted)}@media(max-width:900px){#layout{grid-template-columns:1fr}.left{display:none}.right{position:absolute;right:0;top:58px;width:min(92vw,420px);height:calc(100vh - 58px);z-index:800}.right:empty{display:none}}</style></head><body><header><div class="brand">AURORA <b>LIVE</b></div><span id="mode" class="badge">CONNECTING</span><span id="stats" class="badge">0 EVENTS</span><span id="time" class="badge"></span></header><div id="layout"><aside class="left"><div class="section"><strong>GLOBAL EVENT BROWSER</strong><input id="search" placeholder="Search claims and evidence"><select id="status"><option value="">All verification states</option><option>SUPPORTED</option><option>PLAUSIBLE</option><option>NOT_PROVEN</option></select><select id="category"><option value="">All categories</option><option>conflict</option><option>civil_unrest</option><option>disaster</option><option>cyber</option><option>infrastructure</option><option>health</option><option>world</option></select><button id="refresh">Refresh sources</button></div><div id="events"></div></aside><main><div id="map"></div></main><aside class="right" id="detail"><div class="empty">Select an event to open its evidence room.</div></aside></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const map=L.map('map',{worldCopyJump:true}).setView([20,0],2);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap'}).addTo(map);let data=[],markers=[],selected=null;const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));function color(e){return e.severity==='critical'||e.severity==='high'?'#ff4d4f':e.severity==='medium'?'#f5a623':e.k_align_status==='SUPPORTED'?'#46d38a':'#56a8ff'}function filtered(){const q=$('#search').value.toLowerCase(),st=$('#status').value,cat=$('#category').value;return data.filter(e=>(!q||JSON.stringify(e).toLowerCase().includes(q))&&(!st||e.k_align_status===st)&&(!cat||e.category===cat))}function render(){const list=filtered();$('#events').innerHTML=list.map(e=>`<div class="event ${selected===e.id?'active':''}" data-id="${e.id}"><h3>${esc(e.title)}</h3><div class="meta"><span class="pill ${e.severity}">${e.severity}</span><span class="pill ${e.k_align_status}">${e.k_align_status}</span><span class="pill">${e.confidence_grade} ${e.confidence_score}</span><span class="pill">${e.action_state}</span></div></div>`).join('')||'<div class="empty">No matching events.</div>';document.querySelectorAll('.event').forEach(x=>x.onclick=()=>openEvent(x.dataset.id));markers.forEach(x=>map.removeLayer(x));markers=[];list.filter(e=>e.latitude!=null).forEach(e=>{const m=L.circleMarker([e.latitude,e.longitude],{radius:7,color:color(e),fillOpacity:.75}).addTo(map).bindTooltip(e.title);m.on('click',()=>openEvent(e.id));markers.push(m)})}function openEvent(id){selected=id;const e=data.find(x=>x.id===id);if(!e)return;$('#detail').innerHTML=`<div class="section"><div class="meta"><span class="pill ${e.k_align_status}">${e.k_align_status}</span><span class="pill">${e.confidence_grade}</span><span class="pill">${e.action_state}</span></div><h2>${esc(e.title)}</h2><div class="meta">${esc(e.category)} · ${esc(e.severity)} · ${e.independent_origins} independent origins</div><h4>What changed</h4><div>${esc(e.what_changed)}</div><h4>Why it matters</h4><div>${esc(e.why_it_matters)}</div><h4>Strongest counterargument</h4><div>${esc(e.strongest_counterargument)}</div><h4>Falsifier</h4><div>${esc(e.falsifier)}</div><h4>Score construction</h4><div class="meta">${Object.entries(e.score_components).map(([k,v])=>`<span class="pill">${esc(k)} ${v}</span>`).join('')}</div><h4>Evidence</h4>${e.evidence.map(v=>`<div class="evidence"><a target="_blank" rel="noreferrer" href="${esc(v.url)}">${esc(v.title)}</a><div class="meta">${esc(v.source)} · Tier ${v.source_tier} · ${esc(v.evidence_type)} · ${esc(v.published_at)}</div><div>${esc(v.snippet)}</div></div>`).join('')}</div>`;if(e.latitude!=null)map.flyTo([e.latitude,e.longitude],5);render()}async function load(force=false){$('#mode').textContent='LOADING';const r=await fetch('/api/events'+(force?'?refresh=1':''));const p=await r.json();data=p.events||[];$('#mode').textContent=(p.mode||'unknown').toUpperCase();$('#stats').textContent=`${p.event_count||0} EVENTS · ${p.evidence_count||0} RECORDS`;$('#time').textContent=new Date(p.generated_at).toLocaleTimeString();render();if(data[0])openEvent(data[0].id)}$('#search').oninput=render;$('#status').onchange=render;$('#category').onchange=render;$('#refresh').onclick=()=>load(true);load().catch(e=>{$('#mode').textContent='ERROR';$('#events').innerHTML=`<div class="empty">${esc(e)}</div>`});setInterval(()=>load(false),90000);</script></body></html>
