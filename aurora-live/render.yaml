# AURORA LIVE — Render free blueprint
# https://dashboard.render.com → New → Blueprint → connect this repo
#
# Free limits (2026): web sleeps after ~15m idle; free Postgres ~1GB / ~30 days.
# No separate free Background Worker type — worker is embedded in the web service.

databases:
  - name: aurora-db
    plan: free
    databaseName: aurora
    user: aurora

services:
  - type: web
    name: aurora-live
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    healthCheckPath: /api/platform/live
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aurora-db
          property: connectionString
      - key: AURORA_OPEN_ACCESS
        value: "1"
      - key: AURORA_REQUIRE_WORKER
        value: "0"
      - key: AURORA_EMBED_WORKER
        value: "1"
      - key: AURORA_CORS_ORIGIN
        value: "*"
      - key: AURORA_ALLOWED_HOSTS
        value: "*"
      - key: AURORA_TRUSTED_PROXIES
        value: "0.0.0.0/0"
      - key: GUNICORN_WORKERS
        value: "1"
      - key: GUNICORN_TIMEOUT
        value: "120"
      - key: AURORA_WORKER_STALE_SECONDS
        value: "600"
      - key: AURORA_SOURCE_TIMEOUT_SECONDS
        value: "12"
      - key: AURORA_GROQ_ENABLED
        value: "false"
      - key: AURORA_BOOTSTRAP_SECRET
        generateValue: true
      - key: AURORA_WEBHOOK_SECRET
        generateValue: true
      - key: AURORA_RUNTIME_PATH
        value: "/data/aurora-runtime.json"
