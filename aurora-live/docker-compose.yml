services:
  aurora-platform:
    build: .
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      DATABASE_PATH: /data/aurora-live.db
      AURORA_BOOTSTRAP_SECRET: ${AURORA_BOOTSTRAP_SECRET:?set AURORA_BOOTSTRAP_SECRET}
      AURORA_WEBHOOK_SECRET: ${AURORA_WEBHOOK_SECRET:?set AURORA_WEBHOOK_SECRET}
      AURORA_CORS_ORIGIN: ${AURORA_CORS_ORIGIN:-http://localhost:8090}
    volumes:
      - aurora-data:/data
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

volumes:
  aurora-data:
