services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: aurora
      POSTGRES_USER: aurora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - aurora-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aurora -d aurora"]
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt:
      - no-new-privileges:true

  aurora-platform:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8090:8090"
    environment:
      DATABASE_URL: postgresql://aurora:${POSTGRES_PASSWORD}@postgres:5432/aurora
      AURORA_BOOTSTRAP_SECRET: ${AURORA_BOOTSTRAP_SECRET:?set AURORA_BOOTSTRAP_SECRET}
      AURORA_WEBHOOK_SECRET: ${AURORA_WEBHOOK_SECRET:?set AURORA_WEBHOOK_SECRET}
      AURORA_CORS_ORIGIN: ${AURORA_CORS_ORIGIN:?set AURORA_CORS_ORIGIN}
      AURORA_ALLOWED_HOSTS: ${AURORA_ALLOWED_HOSTS:?set AURORA_ALLOWED_HOSTS}
      AURORA_TRUSTED_PROXIES: ${AURORA_TRUSTED_PROXIES:-}
      AURORA_AUTH_RATE_LIMIT: ${AURORA_AUTH_RATE_LIMIT:-10}
      AURORA_WRITE_RATE_LIMIT: ${AURORA_WRITE_RATE_LIMIT:-120}
      AURORA_RATE_WINDOW_SECONDS: ${AURORA_RATE_WINDOW_SECONDS:-60}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-30}
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

volumes:
  aurora-postgres:
