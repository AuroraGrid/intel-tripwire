services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: aurora
      POSTGRES_USER: aurora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - aurora-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aurora -d aurora"]
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt:
      - no-new-privileges:true

  aurora-platform:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8090:8090"
    environment:
      DATABASE_URL: postgresql://aurora:${POSTGRES_PASSWORD}@postgres:5432/aurora
      AURORA_BOOTSTRAP_SECRET: ${AURORA_BOOTSTRAP_SECRET:?set AURORA_BOOTSTRAP_SECRET}
      AURORA_WEBHOOK_SECRET: ${AURORA_WEBHOOK_SECRET:?set AURORA_WEBHOOK_SECRET}
      AURORA_CORS_ORIGIN: ${AURORA_CORS_ORIGIN:?set AURORA_CORS_ORIGIN}
      AURORA_ALLOWED_HOSTS: ${AURORA_ALLOWED_HOSTS:?set AURORA_ALLOWED_HOSTS}
      AURORA_TRUSTED_PROXIES: ${AURORA_TRUSTED_PROXIES:-}
      AURORA_AUTH_RATE_LIMIT: ${AURORA_AUTH_RATE_LIMIT:-10}
      AURORA_WRITE_RATE_LIMIT: ${AURORA_WRITE_RATE_LIMIT:-120}
      AURORA_RATE_WINDOW_SECONDS: ${AURORA_RATE_WINDOW_SECONDS:-60}
      AURORA_WORKER_STALE_SECONDS: ${AURORA_WORKER_STALE_SECONDS:-120}
      AURORA_REQUIRE_WORKER: ${AURORA_REQUIRE_WORKER:-1}
      AURORA_SOURCE_TIMEOUT_SECONDS: ${AURORA_SOURCE_TIMEOUT_SECONDS:-12}
      AURORA_GROQ_ENABLED: ${AURORA_GROQ_ENABLED:-false}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      AURORA_GROQ_VISION_MODEL: ${AURORA_GROQ_VISION_MODEL:-qwen/qwen3.6-27b}
      AURORA_GROQ_DAILY_LIMIT: ${AURORA_GROQ_DAILY_LIMIT:-40}
      AURORA_GROQ_TIMEOUT_SECONDS: ${AURORA_GROQ_TIMEOUT_SECONDS:-20}
      AURORA_SENSITIVE_TRACK_DELAY_SECONDS: ${AURORA_SENSITIVE_TRACK_DELAY_SECONDS:-86400}
      AURORA_TRACK_STALE_SECONDS: ${AURORA_TRACK_STALE_SECONDS:-900}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-30}
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  aurora-worker:
    build: .
    restart: unless-stopped
    command: ["python", "release_worker.py"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://aurora:${POSTGRES_PASSWORD}@postgres:5432/aurora
      AURORA_WEBHOOK_SECRET: ${AURORA_WEBHOOK_SECRET:?set AURORA_WEBHOOK_SECRET}
      AURORA_REFRESH_INTERVAL_SECONDS: ${AURORA_REFRESH_INTERVAL_SECONDS:-300}
      AURORA_DELIVERY_INTERVAL_SECONDS: ${AURORA_DELIVERY_INTERVAL_SECONDS:-10}
      AURORA_WORKER_LEASE_SECONDS: ${AURORA_WORKER_LEASE_SECONDS:-120}
      AURORA_WORKER_FAILURE_RETRY_SECONDS: ${AURORA_WORKER_FAILURE_RETRY_SECONDS:-30}
      AURORA_DELIVERY_MAX_ATTEMPTS: ${AURORA_DELIVERY_MAX_ATTEMPTS:-5}
      AURORA_DELIVERY_BACKOFF_SECONDS: ${AURORA_DELIVERY_BACKOFF_SECONDS:-30}
      AURORA_DELIVERY_MAX_BACKOFF_SECONDS: ${AURORA_DELIVERY_MAX_BACKOFF_SECONDS:-3600}
      AURORA_SOURCE_TIMEOUT_SECONDS: ${AURORA_SOURCE_TIMEOUT_SECONDS:-12}
      AURORA_MEDIA_INTERVAL_SECONDS: ${AURORA_MEDIA_INTERVAL_SECONDS:-10}
      AURORA_MEDIA_BATCH_SIZE: ${AURORA_MEDIA_BATCH_SIZE:-100}
      AURORA_OPERATING_INTERVAL_SECONDS: ${AURORA_OPERATING_INTERVAL_SECONDS:-10}
      AURORA_OPERATING_BATCH_SIZE: ${AURORA_OPERATING_BATCH_SIZE:-1000}
      AURORA_SENSITIVE_TRACK_DELAY_SECONDS: ${AURORA_SENSITIVE_TRACK_DELAY_SECONDS:-86400}
      AURORA_TRACK_STALE_SECONDS: ${AURORA_TRACK_STALE_SECONDS:-900}
      AURORA_ROUTE_INTERVAL_SECONDS: ${AURORA_ROUTE_INTERVAL_SECONDS:-60}
      AURORA_ROUTE_BATCH_SIZE: ${AURORA_ROUTE_BATCH_SIZE:-100}
      AURORA_FORECAST_INTERVAL_SECONDS: ${AURORA_FORECAST_INTERVAL_SECONDS:-60}
      AURORA_FORECAST_BATCH_SIZE: ${AURORA_FORECAST_BATCH_SIZE:-100}
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  aurora-transport-worker:
    build: .
    restart: unless-stopped
    command: ["python", "phase38_worker.py", "--loop", "--provider", "all"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AURORA_DATABASE_URL: postgresql://aurora:${POSTGRES_PASSWORD}@postgres:5432/aurora
      DATABASE_URL: postgresql://aurora:${POSTGRES_PASSWORD}@postgres:5432/aurora
      AURORA_AISSTREAM_API_KEY: ${AURORA_AISSTREAM_API_KEY:-}
      AURORA_TRANSPORT_PROVIDERS: ${AURORA_TRANSPORT_PROVIDERS:-all}
      AURORA_AVIATION_INTERVAL_SECONDS: ${AURORA_AVIATION_INTERVAL_SECONDS:-300}
      AURORA_MARITIME_INTERVAL_SECONDS: ${AURORA_MARITIME_INTERVAL_SECONDS:-60}
      AURORA_TRANSPORT_HEARTBEAT_SECONDS: ${AURORA_TRANSPORT_HEARTBEAT_SECONDS:-30}
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  aurora-infrastructure-worker:
    build: .
    restart: unless-stopped
    command: ["python", "phase39_worker.py", "--loop", "--interval", "${AURORA_INFRASTRUCTURE_INTERVAL_SECONDS:-300}"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AURORA_DATABASE_URL: postgresql://aurora:${POSTGRES_PASSWORD}@postgres:5432/aurora
      DATABASE_URL: postgresql://aurora:${POSTGRES_PASSWORD}@postgres:5432/aurora
      AURORA_EIA_API_KEY: ${AURORA_EIA_API_KEY:-}
      AURORA_INFRASTRUCTURE_INTERVAL_SECONDS: ${AURORA_INFRASTRUCTURE_INTERVAL_SECONDS:-300}
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  aurora-markets-worker:
    build: .
    restart: unless-stopped
    command: ["python", "phase40_worker.py", "--loop", "--interval", "${AURORA_MARKETS_INTERVAL_SECONDS:-300}"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AURORA_DATABASE_URL: postgresql://aurora:${POSTGRES_PASSWORD}@postgres:5432/aurora
      DATABASE_URL: postgresql://aurora:${POSTGRES_PASSWORD}@postgres:5432/aurora
      AURORA_FRED_API_KEY: ${AURORA_FRED_API_KEY:-}
      AURORA_EIA_API_KEY: ${AURORA_EIA_API_KEY:-}
      AURORA_MARKETS_INTERVAL_SECONDS: ${AURORA_MARKETS_INTERVAL_SECONDS:-300}
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

volumes:
  aurora-postgres:
