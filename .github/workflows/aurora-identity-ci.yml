name: AURORA Identity CI

on:
  push:
    branches:
      - main
      - agent/aurora-identity-rbac-phase-4
    paths:
      - "aurora-live/**"
      - ".github/workflows/aurora-identity-ci.yml"
  pull_request:
    paths:
      - "aurora-live/**"
      - ".github/workflows/aurora-identity-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sqlite:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r aurora-live/requirements.txt
      - run: python -m py_compile aurora-live/identity.py aurora-live/storage.py aurora-live/operations.py aurora-live/production_wsgi.py aurora-live/worker.py
      - run: python -m unittest discover -s aurora-live/tests -p "test_identity.py" -v
      - run: python -m unittest discover -s aurora-live/tests -p "test_identity_api.py" -v

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: aurora_identity
          POSTGRES_USER: aurora
          POSTGRES_PASSWORD: aurora-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aurora -d aurora_identity"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      AURORA_TEST_DATABASE_URL: postgresql://aurora:aurora-test-password@127.0.0.1:5432/aurora_identity
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r aurora-live/requirements.txt
      - run: python -m unittest discover -s aurora-live/tests -p "test_identity.py" -v
      - run: python -m unittest discover -s aurora-live/tests -p "test_migration.py" -v
