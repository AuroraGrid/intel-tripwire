name: AURORA Phase 26 Smoke Gate

on:
  pull_request:
    paths:
      - "aurora-live/phase26_*.py"
      - "aurora-live/release_wsgi.py"
      - "aurora-live/docker-compose.onprem.yml"
      - "aurora-live/tests/test_phase26.py"
      - ".github/workflows/phase26*.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  onprem-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build and start on-premises deployment
        working-directory: aurora-live
        env:
          POSTGRES_PASSWORD: phase26-smoke-password
          AURORA_BOOTSTRAP_SECRET: phase26-smoke-bootstrap
          AURORA_WEBHOOK_SECRET: phase26-smoke-webhook
        run: docker compose -f docker-compose.onprem.yml up --build -d
      - name: Verify containers and health endpoints
        working-directory: aurora-live
        env:
          POSTGRES_PASSWORD: phase26-smoke-password
          AURORA_BOOTSTRAP_SECRET: phase26-smoke-bootstrap
          AURORA_WEBHOOK_SECRET: phase26-smoke-webhook
        run: |
          python - <<'PY'
          import json
          import subprocess
          import time
          import urllib.error
          import urllib.request

          deadline = time.monotonic() + 60
          last_error = None
          while time.monotonic() < deadline:
              try:
                  for endpoint, expected in (("live", "alive"), ("ready", "ready")):
                      with urllib.request.urlopen(
                          f"http://127.0.0.1:8090/api/platform/{endpoint}",
                          timeout=5,
                      ) as response:
                          payload = json.load(response)
                      assert payload["status"] == expected, payload
                  worker_id = subprocess.check_output(
                      [
                          "docker", "compose", "-f", "docker-compose.onprem.yml",
                          "ps", "-q", "aurora-worker",
                      ],
                      text=True,
                  ).strip()
                  if not worker_id:
                      raise RuntimeError("aurora-worker container was not created")
                  worker_state = subprocess.check_output(
                      ["docker", "inspect", "-f", "{{.State.Status}}", worker_id],
                      text=True,
                  ).strip()
                  if worker_state != "running":
                      raise RuntimeError(f"aurora-worker state is {worker_state}")
                  break
              except (
                  AssertionError,
                  OSError,
                  RuntimeError,
                  subprocess.CalledProcessError,
                  urllib.error.URLError,
              ) as exc:
                  last_error = exc
                  print(f"smoke retry: {type(exc).__name__}: {exc}", flush=True)
                  time.sleep(5)
          else:
              raise AssertionError(
                  f"deployment did not become healthy before timeout: {last_error}"
              )
          PY
      - name: Capture smoke diagnostics
        if: always()
        working-directory: aurora-live
        env:
          POSTGRES_PASSWORD: phase26-smoke-password
          AURORA_BOOTSTRAP_SECRET: phase26-smoke-bootstrap
          AURORA_WEBHOOK_SECRET: phase26-smoke-webhook
        run: |
          mkdir -p /tmp/phase26-diagnostics
          docker compose -f docker-compose.onprem.yml ps -a > /tmp/phase26-diagnostics/compose-ps.txt 2>&1 || true
          docker compose -f docker-compose.onprem.yml logs --no-color > /tmp/phase26-diagnostics/compose-logs.txt 2>&1 || true
          python - <<'PY' > /tmp/phase26-diagnostics/endpoints.txt 2>&1 || true
          import urllib.request
          for endpoint in ("live", "ready"):
              try:
                  with urllib.request.urlopen(
                      f"http://127.0.0.1:8090/api/platform/{endpoint}", timeout=5
                  ) as response:
                      print(endpoint, response.status, response.read().decode())
              except Exception as exc:
                  print(endpoint, type(exc).__name__, exc)
          PY
      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase26-smoke-diagnostics
          path: /tmp/phase26-diagnostics
          if-no-files-found: error
      - name: Stop on-premises deployment
        if: always()
        working-directory: aurora-live
        env:
          POSTGRES_PASSWORD: phase26-smoke-password
          AURORA_BOOTSTRAP_SECRET: phase26-smoke-bootstrap
          AURORA_WEBHOOK_SECRET: phase26-smoke-webhook
        run: docker compose -f docker-compose.onprem.yml down -v
