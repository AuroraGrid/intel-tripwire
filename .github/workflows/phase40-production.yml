name: AURORA Phase 40 Production Markets

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'aurora-live/phase40_*.py'
      - '.github/workflows/phase40-production.yml'

permissions:
  contents: read

concurrency:
  group: phase40-production-markets
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      AURORA_DATABASE_URL: ${{ secrets.AURORA_DATABASE_URL }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      AURORA_ALPHA_VANTAGE_API_KEY: ${{ secrets.AURORA_ALPHA_VANTAGE_API_KEY }}
      AURORA_EQUITY_SYMBOLS: ${{ vars.AURORA_EQUITY_SYMBOLS }}
      AURORA_EIA_API_KEY: ${{ secrets.AURORA_EIA_API_KEY }}
      AURORA_EIA_ROUTE: ${{ vars.AURORA_EIA_ROUTE }}
      AURORA_EIA_QUERY: ${{ vars.AURORA_EIA_QUERY }}
      AURORA_EIA_VALUE_FIELD: ${{ vars.AURORA_EIA_VALUE_FIELD }}
      AURORA_WORLD_BANK_COMMODITIES_URL: ${{ vars.AURORA_WORLD_BANK_COMMODITIES_URL }}
      AURORA_COMMODITY_SERIES: ${{ vars.AURORA_COMMODITY_SERIES }}
      AURORA_ECB_CURRENCIES: ${{ vars.AURORA_ECB_CURRENCIES }}
      AURORA_COINBASE_PRODUCTS: ${{ vars.AURORA_COINBASE_PRODUCTS }}
      AURORA_WORLD_BANK_COUNTRIES: ${{ vars.AURORA_WORLD_BANK_COUNTRIES }}
      AURORA_WORLD_BANK_INDICATORS: ${{ vars.AURORA_WORLD_BANK_INDICATORS }}
      AURORA_KALSHI_MARKET_LIMIT: ${{ vars.AURORA_KALSHI_MARKET_LIMIT }}
      AURORA_MARKETS_STALE_SECONDS: ${{ vars.AURORA_MARKETS_STALE_SECONDS || '3600' }}
      AURORA_MARKETS_TIMEOUT_SECONDS: '45'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve activation state
        id: gate
        shell: bash
        run: |
          if [ -n "$AURORA_DATABASE_URL" ] || [ -n "$DATABASE_URL" ]; then
            echo 'active=true' >> "$GITHUB_OUTPUT"
            echo 'Phase 40 production ingestion is active.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'active=false' >> "$GITHUB_OUTPUT"
            echo 'Phase 40 production ingestion is dormant: no PostgreSQL repository secret is configured.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up Python
        if: steps.gate.outputs.active == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install runtime dependencies
        if: steps.gate.outputs.active == 'true'
        run: python -m pip install -r aurora-live/requirements.txt

      - name: Reject ephemeral production storage
        if: steps.gate.outputs.active == 'true'
        shell: bash
        run: |
          target="${AURORA_DATABASE_URL:-$DATABASE_URL}"
          case "$target" in
            postgresql://*|postgres://*) ;;
            *) echo 'Production market ingestion requires PostgreSQL.' >&2; exit 1 ;;
          esac

      - name: Run evidence-gated market ingestion
        if: steps.gate.outputs.active == 'true'
        working-directory: aurora-live
        run: python phase40_worker.py > /tmp/phase40-production.json

      - name: Publish sanitized operational summary
        if: steps.gate.outputs.active == 'true'
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          payload = json.loads(Path('/tmp/phase40-production.json').read_text())
          coverage = payload['coverage']
          health = payload['health']
          lines = [
              '## Phase 40 market ingestion',
              '',
              f"Qualified domains: {coverage['qualified_domains']}/7",
              f"Fully qualified: {coverage['fully_qualified']}",
              '',
              '### Domain state',
          ]
          for domain in health['domains']:
              lines.append(f"- {domain['domain']}: {'OPERATIONAL' if domain['operational'] else 'NOT QUALIFIED'}")
          lines.extend(['', '### Provider state'])
          for provider in health['providers']:
              lines.append(
                  f"- {provider['provider']} ({provider['domain']}): {provider['state']}; "
                  f"retrieval_fresh={provider['retrieval_fresh']}; operational={provider['operational']}"
              )
          lines.extend(['', 'Market observations are informational evidence, not investment advice or executable consolidated quotes.'])
          Path(os.environ['GITHUB_STEP_SUMMARY']).write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
