name: AURORA Phases 40-44 Completion Suite

on:
  pull_request:
    paths:
      - 'aurora-live/phase4*.py'
      - 'aurora-live/static/**'
      - 'aurora-live/release_wsgi.py'
      - 'aurora-live/tests/test_phase4*.py'
      - 'aurora-live/scripts/seed_webcams.py'
      - 'aurora-live/scripts/verify_webcam_matrix.py'
      - 'aurora-live/fixtures/webcam_seed_manifest.json'
  push:
    branches: [main]
    paths:
      - 'aurora-live/phase4*.py'
      - 'aurora-live/static/**'
      - 'aurora-live/release_wsgi.py'
      - 'aurora-live/tests/test_phase4*.py'
      - 'aurora-live/scripts/seed_webcams.py'
      - 'aurora-live/scripts/verify_webcam_matrix.py'
      - 'aurora-live/fixtures/webcam_seed_manifest.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  completion:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install runtime dependencies
        run: python -m pip install -r aurora-live/requirements.txt
      - name: Run completion unit suite
        working-directory: aurora-live
        env:
          AURORA_ENERGY_FEED_URL: ''
          AURORA_FRED_API_KEY: ''
        run: |
          python -m unittest \
            tests.test_phase40 \
            tests.test_phase40_capabilities \
            tests.test_phase41 \
            tests.test_phase42 \
            tests.test_phase43 \
            tests.test_phase44 \
            tests.test_webcam_seed
          python -c "import release_wsgi; from phase44_complete import Phase44Application; assert isinstance(release_wsgi.application, Phase44Application)"
