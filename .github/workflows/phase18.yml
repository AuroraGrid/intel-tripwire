name: AURORA Phase 18 CI

on:
  pull_request:
    paths:
      - "aurora-live/phase16_*.py"
      - "aurora-live/phase17_*.py"
      - "aurora-live/phase18_*.py"
      - "aurora-live/release_wsgi.py"
      - "aurora-live/release_worker.py"
      - "aurora-live/tests/test_phase18.py"
      - ".github/workflows/phase18.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r aurora-live/requirements.txt
      - run: python -m py_compile aurora-live/phase16_synchronized.py aurora-live/phase17_fabric.py aurora-live/phase18_graph.py aurora-live/phase18_complete.py aurora-live/phase18_worker.py aurora-live/release_wsgi.py aurora-live/release_worker.py
      - run: python -m unittest discover -s aurora-live/tests -p "test_phase18.py" -v
