name: AURORA Phase 31 Continuous Benchmarking

on:
  pull_request:
    paths:
      - 'aurora-live/phase31_*.py'
      - 'aurora-live/tests/test_phase31.py'
      - 'aurora-live/release_wsgi.py'
      - '.github/workflows/phase31.yml'
  push:
    branches: [main]
    paths:
      - 'aurora-live/phase31_*.py'
      - 'aurora-live/tests/test_phase31.py'
      - 'aurora-live/release_wsgi.py'
      - '.github/workflows/phase31.yml'

jobs:
  phase31:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile release chain
        working-directory: aurora-live
        run: python -m py_compile phase31_benchmarking.py phase31_complete.py release_wsgi.py tests/test_phase31.py
      - name: Run Phase 31 qualification
        working-directory: aurora-live
        run: python -m unittest tests.test_phase31
      - name: Run Phase 30 regression
        working-directory: aurora-live
        run: python -m unittest tests.test_phase30
      - name: Verify release compatibility
        working-directory: aurora-live
        run: python -c "import release_wsgi; from phase31_complete import Phase31Application; assert isinstance(release_wsgi.application, Phase31Application)"
