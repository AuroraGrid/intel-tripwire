name: AURORA Phase 42 Production UI

on:
  pull_request:
    paths:
      - 'aurora-live/phase42_*.py'
      - 'aurora-live/static/**'
      - 'aurora-live/release_wsgi.py'
      - 'aurora-live/tests/test_phase42*.py'
      - 'aurora-live/docs/PHASE42_PRODUCTION_UI.md'
      - '.github/workflows/phase42.yml'
  push:
    branches: [main]
    paths:
      - 'aurora-live/phase42_*.py'
      - 'aurora-live/static/**'
      - 'aurora-live/release_wsgi.py'
      - 'aurora-live/tests/test_phase42*.py'
      - 'aurora-live/docs/PHASE42_PRODUCTION_UI.md'
      - '.github/workflows/phase42.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sqlite:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install runtime dependencies
        run: python -m pip install -r aurora-live/requirements.txt
      - name: Compile and test Phase 42
        working-directory: aurora-live
        run: |
          python -m py_compile phase42_complete.py release_wsgi.py tests/test_phase42.py
          python -m unittest tests.test_phase42
