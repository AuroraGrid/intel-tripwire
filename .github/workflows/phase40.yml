name: AURORA Phase 40 Global Markets

on:
  pull_request:
    paths:
      - 'aurora-live/phase40_*.py'
      - 'aurora-live/tests/test_phase40*.py'
      - 'aurora-live/release_wsgi.py'
      - 'aurora-live/requirements.txt'
      - 'aurora-live/docs/PHASE40_GLOBAL_MARKETS.md'
      - '.github/workflows/phase40*.yml'
  push:
    branches: [main]
    paths:
      - 'aurora-live/phase40_*.py'
      - 'aurora-live/tests/test_phase40*.py'
      - 'aurora-live/release_wsgi.py'
      - 'aurora-live/requirements.txt'
      - 'aurora-live/docs/PHASE40_GLOBAL_MARKETS.md'
      - '.github/workflows/phase40*.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sqlite:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install runtime dependencies
        run: python -m pip install -r aurora-live/requirements.txt
      - name: Compile Phase 40 release chain
        working-directory: aurora-live
        run: python -m py_compile phase40_markets.py phase40_worker.py phase40_live_qualification.py phase40_capabilities.py phase40_complete.py release_wsgi.py tests/test_phase40.py tests/test_phase40_capabilities.py tests/test_phase40_postgres.py
      - name: Run deterministic Phase 40 qualification
        working-directory: aurora-live
        env:
          AURORA_ALPHA_VANTAGE_API_KEY: ''
          AURORA_EQUITY_SYMBOLS: ''
          AURORA_EIA_API_KEY: ''
        run: python -m unittest tests.test_phase40 tests.test_phase40_capabilities
      - name: Verify release compatibility
        working-directory: aurora-live
        run: python -c "import release_wsgi; from phase40_complete import Phase40Application; assert isinstance(release_wsgi.application, Phase40Application); assert release_wsgi.application._product_manifest()['phase'] == 40"

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: aurora_phase40
          POSTGRES_USER: aurora
          POSTGRES_PASSWORD: aurora-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aurora -d aurora_phase40"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python -m pip install -r aurora-live/requirements.txt
      - name: Qualify PostgreSQL durability
        working-directory: aurora-live
        env:
          AURORA_TEST_POSTGRES_URL: postgresql://aurora:aurora-test@127.0.0.1:5432/aurora_phase40
        run: python -m unittest tests.test_phase40_postgres
