name: AURORA Phase 40 Markets

on:
  pull_request:
    paths:
      - 'aurora-live/phase40_*.py'
      - 'aurora-live/release_wsgi.py'
      - 'aurora-live/tests/test_phase40*.py'
      - 'aurora-live/docs/PHASE40_MARKETS.md'
      - '.github/workflows/phase40.yml'
  push:
    branches: [main]
    paths:
      - 'aurora-live/phase40_*.py'
      - 'aurora-live/release_wsgi.py'
      - 'aurora-live/tests/test_phase40*.py'
      - 'aurora-live/docs/PHASE40_MARKETS.md'
      - '.github/workflows/phase40.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sqlite:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install runtime dependencies
        run: python -m pip install -r aurora-live/requirements.txt
      - name: Compile Phase 40
        working-directory: aurora-live
        run: python -m py_compile phase40_markets.py phase40_capabilities.py phase40_worker.py phase40_complete.py release_wsgi.py tests/test_phase40.py tests/test_phase40_capabilities.py
      - name: Run deterministic Phase 40 tests
        working-directory: aurora-live
        env:
          AURORA_ENERGY_FEED_URL: ''
          AURORA_FRED_API_KEY: ''
        run: python -m unittest tests.test_phase40 tests.test_phase40_capabilities
