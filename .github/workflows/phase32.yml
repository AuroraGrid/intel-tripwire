name: AURORA Phase 32 Canonical Product Spec

on:
  pull_request:
    paths:
      - 'aurora-live/phase32_product_spec.py'
      - 'aurora-live/phase32_complete.py'
      - 'aurora-live/tests/test_phase32.py'
      - 'aurora-live/docs/AURORA_LIVE_CANONICAL_PRODUCT_SPEC.md'
      - 'aurora-live/release_wsgi.py'
      - '.github/workflows/phase32.yml'

jobs:
  phase32:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile release chain
        working-directory: aurora-live
        run: python -m py_compile phase32_product_spec.py phase32_complete.py release_wsgi.py tests/test_phase32.py
      - name: Run Phase 32 qualification
        working-directory: aurora-live/tests
        run: python -m unittest -v test_phase32
      - name: Run Phase 31 regression
        working-directory: aurora-live/tests
        run: python -m unittest -v test_phase31
      - name: Verify release import
        working-directory: aurora-live
        run: python -c "from release_wsgi import application; assert type(application).__name__ == 'Phase32Application'"
