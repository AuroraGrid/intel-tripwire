name: Postgres integration tests

on:
  push:
  pull_request:

jobs:
  postgres-integration:
    name: Postgres integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres" --health-interval=5s --health-timeout=2s --health-retries=10
    env:
      AURORA_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres
      AURORA_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      AURORA_PHASE36_POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/postgres
      AURORA_PHASE37_POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          # Install the runtime dependencies used by the aurora-live package (avoid Windows-only conflicts)
          python -m pip install -r aurora-live/requirements.txt

      - name: Run tests
        run: |
          # Run the full test suite so Postgres-integration tests execute (they are conditionally skipped locally).
          python -m pytest -q
