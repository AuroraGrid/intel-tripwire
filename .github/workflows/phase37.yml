name: AURORA Phase 37 Capability Reconciliation

on:
  pull_request:
    paths:
      - 'aurora-live/phase37_*.py'
      - 'aurora-live/tests/test_phase37.py'
      - 'aurora-live/docs/PHASE37_CAPABILITY_RECONCILIATION.md'
      - 'aurora-live/release_wsgi.py'
      - '.github/workflows/phase37.yml'
      - '.github/workflows/phase36.yml'
  push:
    branches: [main]
    paths:
      - 'aurora-live/phase37_*.py'
      - 'aurora-live/tests/test_phase37.py'
      - 'aurora-live/docs/PHASE37_CAPABILITY_RECONCILIATION.md'
      - 'aurora-live/release_wsgi.py'
      - '.github/workflows/phase37.yml'
      - '.github/workflows/phase36.yml'
  workflow_dispatch:

jobs:
  phase37:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install runtime dependencies
        run: python -m pip install -r aurora-live/requirements.txt
      - name: Compile evidence-aware release chain
        working-directory: aurora-live
        run: python -m py_compile phase37_webcams.py phase37_capabilities.py phase37_complete.py release_wsgi.py tests/test_phase37.py
      - name: Run Phase 37 qualification
        working-directory: aurora-live
        run: python -m unittest tests.test_phase37
      - name: Run Phase 36 regression
        working-directory: aurora-live
        run: python -m unittest tests.test_phase36
      - name: Run Phase 33 webcam regression
        working-directory: aurora-live
        run: python -m unittest tests.test_phase33
      - name: Verify release compatibility
        working-directory: aurora-live
        run: python -c "import release_wsgi; from phase37_complete import Phase37Application; assert isinstance(release_wsgi.application, Phase37Application)"

  postgres-webcam-durability:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aurora
          POSTGRES_PASSWORD: aurora
          POSTGRES_DB: aurora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aurora -d aurora"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      AURORA_PHASE37_POSTGRES_DSN: postgresql://aurora:aurora@localhost:5432/aurora
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r aurora-live/requirements.txt
      - name: Prove PostgreSQL webcam store contract
        working-directory: aurora-live
        run: python -m unittest tests.test_phase37.Phase37Tests.test_postgres_webcam_store_contract
