name: AURORA Phase 38 Live AIS Qualification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase38-live-ais.yml'
      - 'aurora-live/phase38_providers.py'
      - 'aurora-live/phase38_transport.py'
      - 'aurora-live/phase38_worker.py'

permissions:
  contents: read

jobs:
  live-ais:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      AURORA_AISSTREAM_API_KEY: ${{ secrets.AURORA_AISSTREAM_API_KEY }}
      AURORA_TRANSPORT_DB: /tmp/aurora-live-ais.sqlite3
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install bounded live-test dependencies
        run: python -m pip install 'websocket-client>=1.8,<2'

      - name: Verify secret is configured
        shell: bash
        run: |
          test -n "$AURORA_AISSTREAM_API_KEY" || {
            echo 'AURORA_AISSTREAM_API_KEY is not configured'
            exit 1
          }

      - name: Capture one live AIS observation
        working-directory: aurora-live
        run: |
          python phase38_worker.py \
            --provider maritime \
            --database "$AURORA_TRANSPORT_DB" \
            --max-messages 1 \
            --timeout 60 > /tmp/ais-run.json

      - name: Validate durable evidence without exposing the credential
        working-directory: aurora-live
        run: |
          python - <<'PY'
          import json
          import os
          from phase38_transport import TransportStore

          store = TransportStore(os.environ['AURORA_TRANSPORT_DB'])
          observations = store.observations(domain='maritime', provider='aisstream', limit=10)
          providers = store.providers(domain='maritime')
          assert observations, 'no durable AIS observations were recorded'
          provider = next(row for row in providers if row['provider'] == 'aisstream')
          assert provider['state'] == 'ONLINE', provider
          summary = {
              'provider': 'aisstream',
              'state': provider['state'],
              'observations_recorded': len(observations),
              'latest_external_id': observations[0]['external_id'],
              'latest_event_time': observations[0]['event_time'],
              'coverage': store.coverage(),
              'credential_exposed': False,
          }
          with open('/tmp/ais-qualification.json', 'w', encoding='utf-8') as handle:
              json.dump(summary, handle, indent=2, sort_keys=True)
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Upload sanitized qualification evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase38-live-ais-qualification
          path: /tmp/ais-qualification.json
          if-no-files-found: error
          retention-days: 14
