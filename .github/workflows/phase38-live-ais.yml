name: AURORA Phase 38 Live AIS Qualification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase38-live-ais.yml'
      - 'aurora-live/phase38_providers.py'
      - 'aurora-live/phase38_worker.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-ais:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      AURORA_AISSTREAM_API_KEY: ${{ secrets.AURORA_AISSTREAM_API_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install AIS runtime dependency
        run: python -m pip install 'websocket-client>=1.8,<2'

      - name: Verify secret is configured
        shell: bash
        run: |
          if [ -z "$AURORA_AISSTREAM_API_KEY" ]; then
            echo 'AURORA_AISSTREAM_API_KEY is not configured.' >&2
            exit 1
          fi

      - name: Capture one live AIS observation
        working-directory: aurora-live
        run: python phase38_worker.py --provider maritime --database /tmp/aurora-live-ais.sqlite3 --max-messages 1 --timeout 45

      - name: Verify durable observation without exposing credentials
        working-directory: aurora-live
        run: |
          python - <<'PY'
          from phase38_transport import TransportStore

          store = TransportStore('/tmp/aurora-live-ais.sqlite3')
          rows = store.observations(domain='maritime', provider='aisstream', limit=10)
          providers = store.providers(domain='maritime')
          assert rows, 'no durable AIS observations were stored'
          assert any(row['provider'] == 'aisstream' and row['state'] == 'ONLINE' for row in providers)
          assert all('APIKey' not in str(row) for row in rows), 'credential material appeared in stored observations'
          print({'provider': 'aisstream', 'observations': len(rows), 'qualified_run': True})
          PY

      - name: Upload sanitized qualification database
        uses: actions/upload-artifact@v4
        with:
          name: phase38-live-ais-qualification
          path: /tmp/aurora-live-ais.sqlite3
          if-no-files-found: error
          retention-days: 7
