name: AURORA Phase 38 Live AIS Qualification

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/phase38-live-ais.yml'
      - 'aurora-live/phase38_providers.py'
      - 'aurora-live/phase38_worker.py'
  push:
    branches:
      - agent/phase38-ais-live-run-20260728
    paths:
      - '.github/workflows/phase38-live-ais.yml'
      - 'aurora-live/phase38_providers.py'
      - 'aurora-live/phase38_worker.py'

permissions:
  contents: read

jobs:
  live-ais:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      AURORA_AISSTREAM_API_KEY: ${{ secrets.AURORA_AISSTREAM_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime and AIS client
        run: |
          python -m pip install -r aurora-live/requirements.txt
          python -m pip install 'websocket-client>=1.8,<2'
      - name: Verify secret is configured
        shell: bash
        run: |
          test -n "$AURORA_AISSTREAM_API_KEY"
          echo "AISStream secret is configured"
      - name: Capture and persist one live AIS observation
        working-directory: aurora-live
        run: python phase38_worker.py --provider maritime --database /tmp/aurora-live-ais.sqlite3 --max-messages 1 --timeout 45
      - name: Verify durable observation without exposing payload
        working-directory: aurora-live
        run: |
          python - <<'PY'
          from phase38_transport import TransportStore
          store = TransportStore('/tmp/aurora-live-ais.sqlite3')
          rows = store.observations(domain='maritime', provider='aisstream', limit=5)
          assert rows, 'No AISStream observation was durably persisted'
          coverage = store.coverage()
          maritime = next(row for row in coverage['domains'] if row['domain'] == 'maritime')
          assert maritime['qualified'], 'Maritime domain did not meet the evidence gate'
          print('Live AIS observation persisted and maritime evidence gate passed')
          PY
