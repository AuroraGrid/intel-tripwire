name: AURORA Phase 44 Ops Benchmark

on:
  pull_request:
    paths:
      - 'aurora-live/phase44_*.py'
      - 'aurora-live/release_wsgi.py'
      - 'aurora-live/tests/test_phase44*.py'
      - 'aurora-live/docs/PHASE44_OPS_BENCHMARK.md'
      - 'aurora-live/qualification/**'
      - '.github/workflows/phase44.yml'
  push:
    branches: [main]
    paths:
      - 'aurora-live/phase44_*.py'
      - 'aurora-live/release_wsgi.py'
      - 'aurora-live/tests/test_phase44*.py'
      - 'aurora-live/docs/PHASE44_OPS_BENCHMARK.md'
      - 'aurora-live/qualification/**'
      - '.github/workflows/phase44.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sqlite:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install runtime dependencies
        run: python -m pip install -r aurora-live/requirements.txt
      - name: Compile and test Phase 44 + release wire
        working-directory: aurora-live
        run: |
          python -m py_compile phase44_operations.py phase44_benchmark.py phase44_complete.py release_wsgi.py tests/test_phase44.py
          python -m unittest tests.test_phase44
          python -c "import release_wsgi; from phase44_complete import Phase44Application; assert isinstance(release_wsgi.application, Phase44Application); assert release_wsgi.application._product_manifest()['phase'] == 44"
