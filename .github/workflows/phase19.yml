name: AURORA Phase 19 CI

on:
  pull_request:
    paths:
      - "aurora-live/phase18_*.py"
      - "aurora-live/phase19_*.py"
      - "aurora-live/release_wsgi.py"
      - "aurora-live/release_worker.py"
      - "aurora-live/requirements.txt"
      - "aurora-live/tests/test_phase18.py"
      - "aurora-live/tests/test_phase19.py"
      - ".github/workflows/phase19.yml"
  push:
    branches: ["main"]
    paths:
      - "aurora-live/phase19_*.py"
      - "aurora-live/release_wsgi.py"
      - "aurora-live/release_worker.py"
      - "aurora-live/requirements.txt"
      - "aurora-live/tests/test_phase19.py"
      - ".github/workflows/phase19.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r aurora-live/requirements.txt
      - name: Compile Phase 19 release chain
        run: >
          python -m py_compile
          aurora-live/phase19_verification.py
          aurora-live/phase19_ai.py
          aurora-live/phase19_complete.py
          aurora-live/phase19_worker.py
          aurora-live/release_wsgi.py
          aurora-live/release_worker.py
      - name: Verify release imports without cloud credentials
        working-directory: aurora-live
        env:
          AURORA_GROQ_ENABLED: "false"
        run: python -c "import phase19_complete, phase19_worker, release_wsgi, release_worker"
      - name: Run Phase 19 qualification
        run: python -m unittest discover -s aurora-live/tests -p "test_phase19.py" -v
      - name: Run Phase 18 regression
        run: python -m unittest discover -s aurora-live/tests -p "test_phase18.py" -v
