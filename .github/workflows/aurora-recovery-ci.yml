name: AURORA Recovery CI

on:
  pull_request:
    paths:
      - "aurora-live/**"
      - ".github/workflows/aurora-recovery-ci.yml"
  push:
    branches:
      - main
    paths:
      - "aurora-live/**"
      - ".github/workflows/aurora-recovery-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sqlite:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r aurora-live/requirements.txt
      - run: python -m py_compile aurora-live/observability.py aurora-live/backup.py aurora-live/production_wsgi.py aurora-live/worker.py
      - run: python -m unittest discover -s aurora-live/tests -p "test_observability.py" -v
      - run: python -m unittest discover -s aurora-live/tests -p "test_backup.py" -v

  postgres-restore:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: aurora_source
          POSTGRES_USER: aurora
          POSTGRES_PASSWORD: aurora-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aurora -d aurora_source"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r aurora-live/requirements.txt
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Initialize source database
        env:
          PGPASSWORD: aurora-test-password
        run: |
          psql -h 127.0.0.1 -U aurora -d aurora_source -c "CREATE TABLE recovery_probe(id integer primary key, value text); INSERT INTO recovery_probe VALUES (1, 'aurora');"
          createdb -h 127.0.0.1 -U aurora aurora_restore
      - name: Create and verify backup
        env:
          PGPASSWORD: aurora-test-password
        run: |
          python aurora-live/backup.py create --database postgresql://aurora:aurora-test-password@127.0.0.1:5432/aurora_source --output /tmp/aurora.dump
          python aurora-live/backup.py verify --backup /tmp/aurora.dump --target-database postgresql://aurora:aurora-test-password@127.0.0.1:5432/aurora_restore
          test "$(psql -h 127.0.0.1 -U aurora -d aurora_restore -Atqc 'SELECT value FROM recovery_probe WHERE id=1')" = "aurora"
