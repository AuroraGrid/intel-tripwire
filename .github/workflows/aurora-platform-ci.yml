name: AURORA Platform CI

on:
  push:
    branches:
      - main
      - agent/aurora-postgres-phase-1
      - agent/aurora-api-hardening-phase-2
      - agent/aurora-workers-phase-3
      - agent/aurora-identity-rbac-phase-4
    paths:
      - "aurora-live/**"
      - ".github/workflows/aurora-platform-ci.yml"
  pull_request:
    paths:
      - "aurora-live/**"
      - ".github/workflows/aurora-platform-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sqlite:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r aurora-live/requirements.txt
      - name: Compile platform and worker
        run: python -m py_compile aurora-live/database.py aurora-live/identity.py aurora-live/storage.py aurora-live/operations.py aurora-live/delivery.py aurora-live/feeds.py aurora-live/platform_api.py aurora-live/platform_wsgi.py aurora-live/production_wsgi.py aurora-live/worker_state.py aurora-live/worker_delivery.py aurora-live/worker.py aurora-live/scripts/migrate_sqlite_to_postgres.py
      - name: Run SQLite tests
        run: |
          python -m unittest discover -s aurora-live/tests -p "test_platform.py" -v
          python -m unittest discover -s aurora-live/tests -p "test_wsgi.py" -v
          python -m unittest discover -s aurora-live/tests -p "test_worker.py" -v
          python -m unittest discover -s aurora-live/tests -p "test_identity.py" -v
      - name: Smoke-test one worker tick
        run: cd aurora-live && AURORA_OFFLINE=1 DATABASE_PATH=/tmp/aurora-worker.db python worker.py --once --worker-id ci-worker
      - name: Smoke-test API and dashboard
        run: |
          cd aurora-live
          DATABASE_PATH=/tmp/aurora-platform.db AURORA_QUIET=1 gunicorn production_wsgi:application --bind 127.0.0.1:8090 --workers 1 --timeout 30 > /tmp/aurora-platform.log 2>&1 &
          echo $! > /tmp/aurora-platform.pid
          python - <<'PY'
          import json,time,urllib.request
          base="http://127.0.0.1:8090"
          for _ in range(20):
              try:
                  with urllib.request.urlopen(base+"/api/platform/ready",timeout=2) as response:data=json.load(response)
                  assert data["status"]=="ready" and data["database"]=="sqlite"
                  break
              except Exception:time.sleep(.5)
          else:raise SystemExit("platform API did not become healthy")
          with urllib.request.urlopen(base+"/platform",timeout=3) as response:page=response.read().decode();headers=response.headers
          assert "AURORA Platform" in page and "Incident search" in page
          assert headers.get("X-Content-Type-Options")=="nosniff"
          PY
      - if: failure()
        run: cat /tmp/aurora-platform.log || true
      - if: always()
        run: if [ -f /tmp/aurora-platform.pid ]; then kill "$(cat /tmp/aurora-platform.pid)" 2>/dev/null || true; fi

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: aurora_test
          POSTGRES_USER: aurora
          POSTGRES_PASSWORD: aurora-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aurora -d aurora_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      AURORA_TEST_DATABASE_URL: postgresql://aurora:aurora-test-password@127.0.0.1:5432/aurora_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r aurora-live/requirements.txt
      - name: Run PostgreSQL tests
        run: |
          python -m unittest discover -s aurora-live/tests -p "test_platform.py" -v
          python -m unittest discover -s aurora-live/tests -p "test_worker.py" -v
          python -m unittest discover -s aurora-live/tests -p "test_identity.py" -v
          python -m unittest discover -s aurora-live/tests -p "test_migration.py" -v
      - name: Smoke-test PostgreSQL worker and API
        run: |
          cd aurora-live
          AURORA_OFFLINE=1 DATABASE_URL="$AURORA_TEST_DATABASE_URL" python worker.py --once --worker-id postgres-ci-worker
          DATABASE_URL="$AURORA_TEST_DATABASE_URL" AURORA_ALLOWED_HOSTS=127.0.0.1,localhost gunicorn production_wsgi:application --bind 127.0.0.1:8092 --workers 2 --timeout 30 > /tmp/aurora-postgres.log 2>&1 &
          echo $! > /tmp/aurora-postgres.pid
          python - <<'PY'
          import json,time,urllib.request
          url="http://127.0.0.1:8092/api/platform/ready"
          for _ in range(30):
              try:
                  with urllib.request.urlopen(url,timeout=2) as response:data=json.load(response)
                  assert data["status"]=="ready" and data["database"]=="postgres"
                  break
              except Exception:time.sleep(.5)
          else:raise SystemExit("PostgreSQL API did not become healthy")
          PY
      - if: failure()
        run: cat /tmp/aurora-postgres.log || true
      - if: always()
        run: if [ -f /tmp/aurora-postgres.pid ]; then kill "$(cat /tmp/aurora-postgres.pid)" 2>/dev/null || true; fi

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t aurora-platform-ci aurora-live
      - name: Run platform and worker containers
        run: |
          docker network create aurora-ci
          docker run -d --name aurora-platform-ci --network aurora-ci -p 8091:8090 -e AURORA_BOOTSTRAP_SECRET=test-bootstrap-secret -e AURORA_WEBHOOK_SECRET=test-webhook-secret -e AURORA_ALLOWED_HOSTS=127.0.0.1,localhost -e AURORA_CORS_ORIGIN=http://127.0.0.1:8091 -v aurora-platform-ci-data:/data aurora-platform-ci
          docker run -d --name aurora-worker-ci --network aurora-ci -e AURORA_OFFLINE=1 -e DATABASE_PATH=/data/aurora-live.db -v aurora-platform-ci-data:/data aurora-platform-ci python worker.py
      - name: Check platform and worker health
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8091/api/platform/ready | grep -q '"status":"ready"' && docker logs aurora-worker-ci 2>&1 | grep -q worker_started; then
              docker top aurora-platform-ci | grep -q gunicorn
              docker top aurora-worker-ci | grep -q 'python worker.py'
              exit 0
            fi
            sleep 1
          done
          docker logs aurora-platform-ci
          docker logs aurora-worker-ci
          exit 1
      - if: always()
        run: |
          docker rm -f aurora-platform-ci aurora-worker-ci 2>/dev/null || true
          docker network rm aurora-ci 2>/dev/null || true
