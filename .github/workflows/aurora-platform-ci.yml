name: AURORA Platform CI

on:
  push:
    branches:
      - main
      - agent/aurora-postgres-phase-1
      - agent/aurora-api-hardening-phase-2
    paths:
      - "aurora-live/**"
      - ".github/workflows/aurora-platform-ci.yml"
  pull_request:
    paths:
      - "aurora-live/**"
      - ".github/workflows/aurora-platform-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sqlite:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -r aurora-live/requirements.txt
      - name: Compile platform
        run: python -m py_compile aurora-live/database.py aurora-live/storage.py aurora-live/operations.py aurora-live/delivery.py aurora-live/feeds.py aurora-live/platform_api.py aurora-live/platform_wsgi.py aurora-live/scripts/migrate_sqlite_to_postgres.py
      - name: Run SQLite tests
        run: |
          python -m unittest discover -s aurora-live/tests -p "test_platform.py" -v
          python -m unittest discover -s aurora-live/tests -p "test_wsgi.py" -v
      - name: Smoke-test API and dashboard
        run: |
          cd aurora-live
          DATABASE_PATH=/tmp/aurora-platform.db AURORA_QUIET=1 python platform_api.py --host 127.0.0.1 --port 8090 > /tmp/aurora-platform.log 2>&1 &
          echo $! > /tmp/aurora-platform.pid
          python - <<'PY'
          import json, time, urllib.request
          base = "http://127.0.0.1:8090"
          for _ in range(20):
              try:
                  with urllib.request.urlopen(base + "/api/platform/health", timeout=2) as response:
                      data = json.load(response)
                  assert data["status"] == "ok"
                  assert data["database"] == "sqlite"
                  break
              except Exception:
                  time.sleep(0.5)
          else:
              raise SystemExit("platform API did not become healthy")
          with urllib.request.urlopen(base + "/platform", timeout=3) as response:
              page = response.read().decode("utf-8")
              headers = response.headers
          assert "AURORA Platform" in page
          assert "Incident search" in page
          assert headers.get("X-Content-Type-Options") == "nosniff"
          assert "default-src 'self'" in headers.get("Content-Security-Policy", "")
          PY
      - name: Show server log on failure
        if: failure()
        run: cat /tmp/aurora-platform.log || true
      - name: Stop platform API
        if: always()
        run: |
          if [ -f /tmp/aurora-platform.pid ]; then
            kill "$(cat /tmp/aurora-platform.pid)" 2>/dev/null || true
          fi

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: aurora_test
          POSTGRES_USER: aurora
          POSTGRES_PASSWORD: aurora-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aurora -d aurora_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      AURORA_TEST_DATABASE_URL: postgresql://aurora:aurora-test-password@127.0.0.1:5432/aurora_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r aurora-live/requirements.txt
      - name: Run PostgreSQL platform tests
        run: python -m unittest discover -s aurora-live/tests -p "test_platform.py" -v
      - name: Run SQLite-to-PostgreSQL migration test
        run: python -m unittest discover -s aurora-live/tests -p "test_migration.py" -v
      - name: Smoke-test PostgreSQL WSGI API
        run: |
          cd aurora-live
          DATABASE_URL="$AURORA_TEST_DATABASE_URL" AURORA_ALLOWED_HOSTS=127.0.0.1,localhost gunicorn platform_wsgi:application --bind 127.0.0.1:8092 --workers 2 --timeout 30 > /tmp/aurora-postgres.log 2>&1 &
          echo $! > /tmp/aurora-postgres.pid
          python - <<'PY'
          import json, time, urllib.request
          base = "http://127.0.0.1:8092"
          for _ in range(30):
              try:
                  req = urllib.request.Request(base + "/api/platform/ready", headers={"X-Request-ID":"ci-check"})
                  with urllib.request.urlopen(req, timeout=2) as response:
                      data = json.load(response)
                      headers = response.headers
                  assert data["status"] == "ready"
                  assert data["database"] == "postgres"
                  assert headers["X-Request-ID"] == "ci-check"
                  assert headers["X-Frame-Options"] == "DENY"
                  break
              except Exception:
                  time.sleep(0.5)
          else:
              raise SystemExit("PostgreSQL-backed WSGI API did not become healthy")
          PY
      - name: Show PostgreSQL API log on failure
        if: failure()
        run: cat /tmp/aurora-postgres.log || true
      - name: Stop PostgreSQL API
        if: always()
        run: |
          if [ -f /tmp/aurora-postgres.pid ]; then
            kill "$(cat /tmp/aurora-postgres.pid)" 2>/dev/null || true
          fi

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build container
        run: docker build -t aurora-platform-ci aurora-live
      - name: Run SQLite fallback container
        run: |
          docker run -d --name aurora-platform-ci -p 8091:8090 \
            -e AURORA_BOOTSTRAP_SECRET=test-bootstrap-secret \
            -e AURORA_WEBHOOK_SECRET=test-webhook-secret \
            -e AURORA_ALLOWED_HOSTS=127.0.0.1,localhost \
            -e AURORA_CORS_ORIGIN=http://127.0.0.1:8091 \
            -v aurora-platform-ci-data:/data aurora-platform-ci
      - name: Check Gunicorn container health
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent -D /tmp/headers http://127.0.0.1:8091/api/platform/ready >/tmp/body; then
              grep -qi '^X-Request-ID:' /tmp/headers
              grep -q '"status":"ready"' /tmp/body
              docker top aurora-platform-ci | grep -q gunicorn
              exit 0
            fi
            sleep 1
          done
          docker logs aurora-platform-ci
          exit 1
      - name: Stop container
        if: always()
        run: docker rm -f aurora-platform-ci 2>/dev/null || true
