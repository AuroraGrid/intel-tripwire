    paths:
      - "aurora-live/phase15_*.py"
      - "aurora-live/tests/test_phase15.py"
      - "aurora-live/release_wsgi.py"
      - ".github/workflows/aurora-phase15-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3