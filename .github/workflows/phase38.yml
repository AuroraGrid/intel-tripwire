name: AURORA Phase 38 Transport Intelligence

on:
  pull_request:
    paths:
      - 'aurora-live/phase38_*.py'
      - 'aurora-live/tests/test_phase38.py'
      - 'aurora-live/release_wsgi.py'
      - 'aurora-live/requirements.txt'
      - 'aurora-live/docs/PHASE38_PROVIDER_ADAPTERS.md'
      - '.github/workflows/phase38.yml'
  push:
    branches: [main]
    paths:
      - 'aurora-live/phase38_*.py'
      - 'aurora-live/tests/test_phase38.py'
      - 'aurora-live/release_wsgi.py'
      - 'aurora-live/requirements.txt'
      - 'aurora-live/docs/PHASE38_PROVIDER_ADAPTERS.md'
      - '.github/workflows/phase38.yml'
  workflow_dispatch:

jobs:
  phase38:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install runtime dependencies
        run: python -m pip install -r aurora-live/requirements.txt
      - name: Compile transport release chain
        working-directory: aurora-live
        run: python -m py_compile phase38_transport.py phase38_providers.py phase38_worker.py phase38_complete.py release_wsgi.py tests/test_phase38.py
      - name: Run Phase 38 qualification
        working-directory: aurora-live
        env:
          AURORA_AISSTREAM_API_KEY: ''
        run: python -m unittest tests.test_phase38
      - name: Verify worker rejects missing AIS credential safely
        working-directory: aurora-live
        env:
          AURORA_AISSTREAM_API_KEY: ''
        run: |
          python phase38_worker.py --provider maritime --database :memory: --max-messages 1 && exit 1 || test $? -eq 1
      - name: Run Phase 37 regression
        working-directory: aurora-live
        run: python -m unittest tests.test_phase37
      - name: Verify release compatibility
        working-directory: aurora-live
        run: python -c "import release_wsgi; from phase38_complete import Phase38Application; assert isinstance(release_wsgi.application, Phase38Application)"
