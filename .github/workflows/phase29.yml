name: AURORA Phase 29 Enterprise Controls

on:
  pull_request:
    paths:
      - "aurora-live/phase28_*.py"
      - "aurora-live/phase29_*.py"
      - "aurora-live/release_wsgi.py"
      - "aurora-live/tests/test_phase28.py"
      - "aurora-live/tests/test_phase29.py"
      - "aurora-live/docs/PHASE29_ENTERPRISE_CONTROLS.md"
      - ".github/workflows/phase29.yml"
  push:
    branches: ["main"]
    paths:
      - "aurora-live/phase29_*.py"
      - "aurora-live/release_wsgi.py"
      - "aurora-live/tests/test_phase29.py"
      - ".github/workflows/phase29.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase29:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r aurora-live/requirements.txt
      - name: Compile release
        run: >-
          python -m py_compile
          aurora-live/phase29_enterprise.py
          aurora-live/phase29_complete.py
          aurora-live/release_wsgi.py
          aurora-live/tests/test_phase29.py
      - name: Verify imports
        working-directory: aurora-live
        env:
          AURORA_GROQ_ENABLED: "false"
        run: python -c "import phase29_enterprise, phase29_complete, release_wsgi"
      - name: Run Phase 29 tests
        run: python -m unittest discover -s aurora-live/tests -p "test_phase29.py" -v
      - name: Run Phase 28 regression
        run: python -m unittest discover -s aurora-live/tests -p "test_phase28.py" -v
