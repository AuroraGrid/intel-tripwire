name: AURORA Phase 13 CI

on:
  pull_request:
    paths:
      - "aurora-live/phase13_*.py"
      - "aurora-live/tests/test_phase13.py"
      - "aurora-live/release_wsgi.py"
      - ".github/workflows/aurora-phase13-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sqlite:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r aurora-live/requirements.txt
      - run: python -m py_compile aurora-live/phase13_delivery.py aurora-live/phase13_complete.py aurora-live/release_wsgi.py
      - run: python -m unittest discover -s aurora-live/tests -p "test_phase13.py" -v

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: aurora_test
          POSTGRES_USER: aurora
          POSTGRES_PASSWORD: aurora-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aurora -d aurora_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      AURORA_TEST_DATABASE_URL: postgresql://aurora:aurora-test-password@127.0.0.1:5432/aurora_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r aurora-live/requirements.txt
      - run: DATABASE_URL="$AURORA_TEST_DATABASE_URL" python -m unittest discover -s aurora-live/tests -p "test_phase13.py" -v
