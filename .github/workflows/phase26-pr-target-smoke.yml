name: AURORA Phase 26 PR Target Smoke Gate

on:
  pull_request_target:
    types: [edited]

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  smoke:
    if: github.event.pull_request.number == 44 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POSTGRES_PASSWORD: phase26-smoke-password
      AURORA_BOOTSTRAP_SECRET: phase26-smoke-bootstrap
      AURORA_WEBHOOK_SECRET: phase26-smoke-webhook
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Mark smoke gate pending
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.HEAD_SHA,
              state: 'pending',
              context: 'phase26-smoke/pr-target',
              description: 'On-premises deployment smoke gate is running',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Build and start on-premises deployment
        working-directory: aurora-live
        run: docker compose -f docker-compose.onprem.yml up --build -d

      - name: Verify containers and health endpoints
        working-directory: aurora-live
        run: |
          python - <<'PY'
          import json
          import subprocess
          import time
          import urllib.error
          import urllib.request

          deadline = time.monotonic() + 180
          last_error = None
          while time.monotonic() < deadline:
              try:
                  for endpoint, expected in (("live", "live"), ("ready", "ready")):
                      with urllib.request.urlopen(
                          f"http://127.0.0.1:8090/api/platform/{endpoint}",
                          timeout=5,
                      ) as response:
                          payload = json.load(response)
                      assert payload["status"] == expected, payload
                  worker_id = subprocess.check_output(
                      ["docker", "compose", "-f", "docker-compose.onprem.yml", "ps", "-q", "aurora-worker"],
                      text=True,
                  ).strip()
                  if not worker_id:
                      raise RuntimeError("aurora-worker container was not created")
                  worker_state = subprocess.check_output(
                      ["docker", "inspect", "-f", "{{.State.Status}}", worker_id],
                      text=True,
                  ).strip()
                  if worker_state != "running":
                      raise RuntimeError(f"aurora-worker state is {worker_state}")
                  break
              except (AssertionError, OSError, RuntimeError, subprocess.CalledProcessError, urllib.error.URLError) as exc:
                  last_error = exc
                  time.sleep(5)
          else:
              raise AssertionError(f"deployment did not become healthy before timeout: {last_error}")
          PY

      - name: Show state on failure
        if: failure()
        working-directory: aurora-live
        run: |
          docker compose -f docker-compose.onprem.yml ps
          docker compose -f docker-compose.onprem.yml logs --no-color

      - name: Stop deployment
        if: always()
        working-directory: aurora-live
        run: docker compose -f docker-compose.onprem.yml down -v

      - name: Publish smoke gate result
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const passed = process.env.JOB_STATUS === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.HEAD_SHA,
              state: passed ? 'success' : 'failure',
              context: 'phase26-smoke/pr-target',
              description: passed ? 'On-premises deployment smoke gate passed' : 'On-premises deployment smoke gate failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
