  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 75% 30%, rgba(42,116,160,.24), transparent 32%),
        radial-gradient(circle at 15% 70%, rgba(30,92,117,.18), transparent 28%),
        #07111f;
      color: #f7f9fb;
    }
    .shell { width: min(920px, calc(100% - 32px)); padding: 56px 0; }
    .card {
      border: 1px solid rgba(160,205,220,.18);
      background: rgba(8,22,37,.82);
      backdrop-filter: blur(12px);
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 30px 90px rgba(0,0,0,.38);
    }
    .hero { width: 100%; display:block; aspect-ratio: 1200/630; object-fit: cover; background:#0a1522; }
    .content { padding: 30px; }
    .eyebrow { color:#8ed5d0; text-transform:uppercase; letter-spacing:.14em; font-size:12px; font-weight:700; }
    h1 { margin: 10px 0 10px; font-size: clamp(34px, 6vw, 64px); line-height:.98; }
    p { margin:0; color:#bdcad4; font-size:18px; line-height:1.55; max-width:680px; }
    .actions { display:flex; flex-wrap:wrap; gap:12px; margin-top:26px; }
    .button { display:inline-flex; align-items:center; justify-content:center; min-height:48px; padding:0 20px; border-radius:14px; text-decoration:none; font-weight:750; }
    .primary { background:#e8f3f1; color:#07111f; }
    .secondary { border:1px solid rgba(232,243,241,.22); color:#e8f3f1; }
    .note { margin-top:18px; color:#7f93a4; font-size:13px; }
  </style>

<body>
  <main class="shell">
    <section class="card">
      <img class="hero" src="https://raw.githubusercontent.com/hr185882-creator/intel-tripwire/main/earthclarity-social.jpg" alt="EarthClarity — Global signals. Source-backed clarity. Private OSINT Beta.">
      <div class="content">
        <div class="eyebrow">Private OSINT Beta</div>

        <div class="actions">
          <a class="button primary" href="https://earthclarity.manus.space/">Open EarthClarity</a>
          <a class="button secondary" href="https://github.com/hr185882-creator/intel-tripwire">View project lineage</a>
        </div>
        <div class="note">Live coverage expands only as individual sources pass runtime qualification.</div>
      </div>
    </section>
  </main>
